<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anyós Fatality</title>
  <style>
    :root {
      --bg1: #090812;
      --bg2: #180f25;
      --bg3: #331d41;
      --panel: rgba(20, 14, 31, 0.9);
      --cyan: #8aeaff;
      --cyan2: #29c6ff;
      --red: #ff637d;
      --red2: #d7284a;
      --gold: #ffd56d;
      --gold2: #ff9e3d;
      --violet: #cf8dff;
      --text: #f7f8ff;
      --shadow: rgba(0,0,0,0.58);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, var(--bg2), var(--bg1));
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
    }

    .game-shell {
      position: relative;
      width: min(1180px, 96vw);
      height: min(760px, 90vh);
      border-radius: 24px;
      overflow: hidden;
      background: rgba(17, 12, 25, 0.96);
      border: 2px solid rgba(255,255,255,0.12);
      box-shadow:
        0 0 0 2px rgba(129, 234, 255, 0.08),
        0 30px 90px rgba(0,0,0,0.64),
        inset 0 0 26px rgba(255,255,255,0.03);
    }

    .game-shell.shake {
      animation: shake 0.18s linear 2;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      50% { transform: translateX(7px); }
      75% { transform: translateX(-4px); }
    }

    .hud {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 18px;
      z-index: 30;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .fighter-info {
      width: 40%;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .fighter-info.right {
      align-items: flex-end;
    }

    .label-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 900;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 4px 12px rgba(0,0,0,0.72);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 14px currentColor;
    }

    .player .dot { background: var(--cyan); color: var(--cyan); }
    .enemy .dot { background: var(--red); color: var(--red); }

    .health-bar {
      position: relative;
      width: 100%;
      height: 24px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      box-shadow: inset 0 0 18px rgba(0,0,0,0.4);
    }

    .health-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 100%;
      border-radius: 12px;
      transition: width 0.2s ease;
    }

    .player .health-fill {
      background: linear-gradient(90deg, #8aeaff, #4ecafc 42%, #1d8ff0 100%);
    }

    .enemy .health-fill {
      background: linear-gradient(90deg, #ffaba8, #ff5867 42%, #cd2148 100%);
    }

    .status-box {
      position: absolute;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      z-index: 25;
      min-width: 200px;
      text-align: center;
      background: rgba(12, 9, 20, 0.48);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 999px;
      padding: 7px 16px;
      color: rgba(255,255,255,0.9);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }

    .arena {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% 18%, rgba(128, 118, 255, 0.28), transparent 22%),
        linear-gradient(180deg, #171827 0%, #3a1d41 32%, #2a1a2f 100%);
      overflow: hidden;
    }

    .arena::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.024) 0,
        rgba(255,255,255,0.024) 1px,
        transparent 1px,
        transparent 28px
      );
      opacity: 0.8;
    }

    .sun-glow {
      position: absolute;
      left: 50%;
      top: 12%;
      transform: translateX(-50%);
      width: 420px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.22), rgba(126,110,255,0.14), transparent 68%);
      filter: blur(18px);
    }

    .spotlight {
      position: absolute;
      left: 50%;
      top: 30%;
      transform: translateX(-50%);
      width: 620px;
      height: 260px;
      background: radial-gradient(circle at center, rgba(255,255,255,0.08), rgba(255,255,255,0.02), transparent 64%);
      filter: blur(16px);
    }

    .floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 140px;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.0), rgba(0,0,0,0.22)),
        linear-gradient(90deg, #2a2430, #1f1b2d 36%, #2d263a 100%);
      border-top: 4px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 10px 18px rgba(255,255,255,0.04);
    }

    .floor::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,0.12) 0 2px, transparent 2px 18px);
      opacity: 0.12;
    }

    .fighter {
      --tx: 0px;
      --scale: 1;
      position: absolute;
      bottom: 108px;
      width: 180px;
      height: 260px;
      transform: translateX(var(--tx)) scaleX(var(--scale));
      transition: transform 0.12s ease-out, filter 0.12s ease;
      z-index: 10;
      filter: drop-shadow(0 18px 18px rgba(0,0,0,0.25));
    }

    .fighter.player {
      left: 24%;
    }

    .fighter.enemy {
      left: 74%;
      --scale: -1;
    }

    .fighter .shadow {
      position: absolute;
      left: 50%;
      bottom: -18px;
      width: 110px;
      height: 22px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(0,0,0,0.34);
      filter: blur(3px);
    }

    .fighter .head {
      position: absolute;
      left: 50%;
      top: 0;
      width: 64px;
      height: 72px;
      transform: translateX(-50%);
      border-radius: 48% 48% 46% 46%;
      background: linear-gradient(180deg, #f7dcb2, #d89966 70%, #9c5b3f);
      box-shadow: inset -10px -8px 0 rgba(0,0,0,0.05);
    }

    .fighter .head::before,
    .fighter .head::after {
      content: "";
      position: absolute;
      top: 22px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(0,0,0,0.78);
    }

    .fighter .head::before { left: 17px; }
    .fighter .head::after { right: 17px; }

    .fighter .hair {
      position: absolute;
      left: 50%;
      top: -6px;
      width: 74px;
      height: 26px;
      transform: translateX(-50%);
      border-radius: 50% 50% 24% 24%;
      background: rgba(18, 10, 11, 0.82);
    }

    .fighter .body {
      position: absolute;
      left: 50%;
      top: 58px;
      width: 86px;
      height: 94px;
      transform: translateX(-50%);
      border-radius: 30% 30% 16% 16% / 22% 22% 12% 12%;
      background: linear-gradient(180deg, #ffe9c9, #d29d69 58%, #84563a);
      box-shadow: inset -12px -10px 0 rgba(0,0,0,0.06);
    }

    .fighter .arm {
      position: absolute;
      width: 18px;
      height: 88px;
      top: 82px;
      border-radius: 20px;
      background: linear-gradient(180deg, #f7d2a4, #d18862);
      transform-origin: center top;
    }

    .fighter .arm.left { left: 24px; transform: rotate(30deg); }
    .fighter .arm.right { right: 24px; transform: rotate(-28deg); }

    .fighter .leg {
      position: absolute;
      bottom: 0;
      width: 22px;
      height: 104px;
      border-radius: 18px;
      background: linear-gradient(180deg, #ebc7a1, #b77b5d);
    }

    .fighter .leg.left { left: 58px; }
    .fighter .leg.right { right: 58px; }

    .fighter.player .head {
      background: linear-gradient(180deg, #f4d7b0, #dc9468 70%, #a25d40);
    }

    .fighter.player .hair { background: rgba(19, 30, 58, 0.84); }

    .fighter.player .body,
    .fighter.player .arm,
    .fighter.player .leg {
      background: linear-gradient(180deg, #d2ebff, #72bfff 60%, #2d5cc7);
    }

    .fighter.enemy .head {
      background: linear-gradient(180deg, #f8d7b1, #d98b62 70%, #954a38);
    }

    .fighter.enemy .hair { background: rgba(43, 15, 28, 0.8); }

    .fighter.enemy .body,
    .fighter.enemy .arm,
    .fighter.enemy .leg {
      background: linear-gradient(180deg, #ffd7d4, #e96b71 60%, #8c2140);
    }

    .fighter.hit {
      animation: hitFlash 0.3s ease-out;
    }

    @keyframes hitFlash {
      0% { filter: brightness(1) saturate(1); }
      25% { filter: brightness(1.75) saturate(1.4); }
      50% { filter: brightness(1) saturate(1); transform: translateX(var(--tx)) scaleX(var(--scale)) translateX(-10px); }
      100% { filter: brightness(1) saturate(1); transform: translateX(var(--tx)) scaleX(var(--scale)); }
    }

    .fighter.attack {
      animation: attackBump 0.18s ease-out;
    }

    @keyframes attackBump {
      0% { transform: translateX(var(--tx)) scaleX(var(--scale)) translateY(0); }
      35% { transform: translateX(var(--tx)) scaleX(var(--scale)) translateX(14px) translateY(-8px); }
      100% { transform: translateX(var(--tx)) scaleX(var(--scale)); }
    }

    .impact {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      z-index: 15;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .impact.show {
      animation: burst 0.42s ease-out forwards;
    }

    @keyframes burst {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
    }

    .impact.punch {
      background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,224,129,0.9) 18%, rgba(255,137,72,0.7) 42%, transparent 72%);
    }

    .impact.kick {
      background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(122,224,255,0.9) 18%, rgba(42,126,255,0.7) 42%, transparent 72%);
    }

    .impact.special {
      background: radial-gradient(circle, rgba(255,255,255,0.96) 0%, rgba(255,194,229,0.9) 18%, rgba(191,92,255,0.72) 42%, transparent 72%);
    }

    .swoosh {
      position: absolute;
      width: 220px;
      height: 110px;
      border: 4px solid rgba(255,255,255,0.26);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-9deg);
      opacity: 0;
      z-index: 14;
      pointer-events: none;
    }

    .swoosh.show {
      animation: swoosh 0.28s ease-out forwards;
    }

    @keyframes swoosh {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(-9deg) scale(0.2); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(-9deg) scale(1.12); }
    }

    .finish-message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      background: rgba(9, 7, 16, 0.38);
    }

    .finish-message.show {
      opacity: 1;
      pointer-events: auto;
    }

    .finish-card {
      background: rgba(18, 12, 30, 0.92);
      border: 2px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      padding: 24px 28px;
      text-align: center;
      box-shadow: 0 0 32px rgba(0,0,0,0.48);
      max-width: 520px;
    }

    .finish-card h2 {
      margin: 0 0 10px 0;
      font-size: clamp(26px, 3vw, 42px);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .finish-card p {
      margin: 0 0 18px 0;
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      line-height: 1.5;
    }

    .finish-card button {
      min-width: 180px;
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      width: min(760px, 90%);
    }

    button {
      appearance: none;
      border: none;
      cursor: pointer;
      outline: none;
      color: #180b0d;
      background: linear-gradient(180deg, #ffe595, #f7b744 62%, #d97b25);
      border-radius: 12px;
      padding: 12px 18px;
      min-width: 138px;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      box-shadow:
        0 8px 0 rgba(125, 61, 0, 0.84),
        0 14px 20px rgba(0,0,0,0.22);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.2s ease;
    }

    button:active {
      transform: translateY(4px);
      box-shadow:
        0 4px 0 rgba(125, 61, 0, 0.84),
        0 8px 18px rgba(0,0,0,0.2);
    }

    button.alt {
      background: linear-gradient(180deg, #9feeff, #42cafb 60%, #1d80d9);
      box-shadow:
        0 8px 0 rgba(12, 67, 113, 0.82),
        0 14px 20px rgba(0,0,0,0.22);
    }

    button.warn {
      background: linear-gradient(180deg, #ffd8ee, #ff69c2 60%, #d03fa8);
      box-shadow:
        0 8px 0 rgba(111, 22, 82, 0.84),
        0 14px 20px rgba(0,0,0,0.22);
    }

    @media (max-width: 760px) {
      .game-shell { width: 96vw; height: 88vh; }
      .fighter-info { width: 42%; }
      .controls { width: 92%; gap: 8px; }
      button { min-width: 102px; padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <div class="game-shell" id="gameShell">
    <div class="hud">
      <div class="fighter-info player">
        <div class="label-row">
          <span class="dot"></span>
          <span>Te</span>
        </div>
        <div class="health-bar">
          <div class="health-fill" id="playerHealth"></div>
        </div>
      </div>

      <div class="fighter-info enemy right">
        <div class="label-row">
          <span>Anyós</span>
          <span class="dot"></span>
        </div>
        <div class="health-bar">
          <div class="health-fill" id="enemyHealth"></div>
        </div>
      </div>
    </div>

    <div class="status-box" id="statusBox">Küzdelem</div>

    <div class="arena" id="arena">
      <div class="sun-glow"></div>
      <div class="spotlight"></div>

      <div class="fighter player" id="player">
        <div class="shadow"></div>
        <div class="head"></div>
        <div class="hair"></div>
        <div class="body"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>

      <div class="fighter enemy" id="enemy">
        <div class="shadow"></div>
        <div class="head"></div>
        <div class="hair"></div>
        <div class="body"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>

      <div class="impact punch" id="playerImpact"></div>
      <div class="impact punch" id="enemyImpact"></div>
      <div class="swoosh" id="playerSwoosh"></div>
      <div class="swoosh" id="enemySwoosh"></div>

      <div class="floor"></div>
    </div>

    <div class="controls">
      <button id="punchBtn">Ütés</button>
      <button id="kickBtn" class="alt">Rúgás</button>
      <button id="specialBtn" class="warn">Fatality</button>
    </div>

    <div class="finish-message" id="finishMessage">
      <div class="finish-card">
        <h2 id="finishTitle">Győzelem!</h2>
        <p id="finishText">A családi béke helyreállt.</p>
        <button id="restartBtn">Új kör</button>
      </div>
    </div>
  </div>

  <script>
    const player = document.getElementById('player');
    const enemy = document.getElementById('enemy');
    const playerHealthBar = document.getElementById('playerHealth');
    const enemyHealthBar = document.getElementById('enemyHealth');
    const statusBox = document.getElementById('statusBox');
    const playerImpact = document.getElementById('playerImpact');
    const enemyImpact = document.getElementById('enemyImpact');
    const playerSwoosh = document.getElementById('playerSwoosh');
    const enemySwoosh = document.getElementById('enemySwoosh');
    const finishMessage = document.getElementById('finishMessage');
    const finishTitle = document.getElementById('finishTitle');
    const finishText = document.getElementById('finishText');
    const gameShell = document.getElementById('gameShell');
    const punchBtn = document.getElementById('punchBtn');
    const kickBtn = document.getElementById('kickBtn');
    const specialBtn = document.getElementById('specialBtn');
    const restartBtn = document.getElementById('restartBtn');

    const state = {
      playerHP: 100,
      enemyHP: 100,
      gameOver: false,
      aiLocked: false,
      combo: 0,
      lastMove: 'Küzdelem'
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function setHealth(el, value) {
      el.style.width = value + '%';
    }

    function setStatus(text) {
      statusBox.textContent = text;
    }

    function shakeArena() {
      gameShell.classList.remove('shake');
      void gameShell.offsetWidth;
      gameShell.classList.add('shake');
    }

    function applyImpact(target, type) {
      target.className = 'impact show ' + type;
      setTimeout(() => {
        target.className = 'impact ' + type;
      }, 420);
    }

    function applySwoosh(target, left, top) {
      target.style.left = left + '%';
      target.style.top = top + '%';
      target.classList.remove('show');
      void target.offsetWidth;
      target.classList.add('show');
      setTimeout(() => target.classList.remove('show'), 280);
    }

    function attackAnim(fighter) {
      fighter.classList.remove('attack');
      void fighter.offsetWidth;
      fighter.classList.add('attack');
      setTimeout(() => fighter.classList.remove('attack'), 180);
    }

    function hitAnim(fighter) {
      fighter.classList.remove('hit');
      void fighter.offsetWidth;
      fighter.classList.add('hit');
      setTimeout(() => fighter.classList.remove('hit'), 300);
    }

    function finishGame(playerWon, text) {
      state.gameOver = true;
      finishTitle.textContent = playerWon ? 'Győzelem!' : 'Vereség!';
      finishText.textContent = text;
      finishMessage.classList.add('show');
      setStatus(playerWon ? 'Kikaptad az anyóst' : 'Megdőltél');
    }

    function doDamage(target, amount) {
      if (target === 'player') {
        state.playerHP = clamp(state.playerHP - amount, 0, 100);
        setHealth(playerHealthBar, state.playerHP);
        hitAnim(player);
        shakeArena();
      } else {
        state.enemyHP = clamp(state.enemyHP - amount, 0, 100);
        setHealth(enemyHealthBar, state.enemyHP);
        hitAnim(enemy);
        shakeArena();
      }

      if (state.playerHP <= 0) {
        finishGame(false, 'Az anyós végzett veled. A családközösségben most már senki nem kérdezi meg, ki nyert.');
      }

      if (state.enemyHP <= 0) {
        finishGame(true, 'FATALITY! Az anyós a földre került, a szoba csendben maradt, és a család végre levegőt kapott.');
      }
    }

    function playerAttack(type) {
      if (state.gameOver || state.aiLocked) return;

      let damage = 8;
      let effectType = 'punch';

      if (type === 'kick') {
        damage = 14;
        effectType = 'kick';
      } else if (type === 'special') {
        damage = 24;
        effectType = 'special';
      }

      state.aiLocked = true;
      attackAnim(player);
      applySwoosh(playerSwoosh, 48, 52);
      applyImpact(playerImpact, effectType);
      playerImpact.style.left = '62%';
      playerImpact.style.top = '54%';

      if (type === 'special' && state.enemyHP <= 35) {
        state.enemyHP = 0;
        setHealth(enemyHealthBar, 0);
        finishGame(true, 'FATALITY! A végső csapás megsemmisítette az anyóst. A család életet nyert.');
        return;
      }

      const blocked = Math.random() > 0.82 && type !== 'special';
      const finalDamage = blocked ? Math.ceil(damage * 0.35) : damage;

      if (!blocked) {
        doDamage('enemy', finalDamage);
        state.combo += 1;
        setStatus(type === 'special' ? 'Pörgetett kombináció!' : 'Kombó!');
      } else {
        hitAnim(enemy);
        setStatus('Az anyós blokkolt!');
      }

      if (!state.gameOver) {
        setTimeout(() => {
          state.aiLocked = false;
          if (!state.gameOver) enemyAiTurn();
        }, 440);
      }
    }

    function enemyAiTurn() {
      if (state.gameOver) return;

      const roll = Math.random();
      let type = 'punch';
      let damage = 8;

      if (roll > 0.68) {
        type = 'kick';
        damage = 14;
      }
      if (roll > 0.9) {
        type = 'special';
        damage = 24;
      }

      attackAnim(enemy);
      applySwoosh(enemySwoosh, 58, 52);
      applyImpact(enemyImpact, type);
      enemyImpact.style.left = '38%';
      enemyImpact.style.top = '54%';

      const blocked = Math.random() > 0.82;
      const finalDamage = blocked ? Math.ceil(damage * 0.38) : damage;

      if (!blocked) {
        doDamage('player', finalDamage);
        setStatus(type === 'special' ? 'Az anyós különlegeset dobott!' : 'Az anyós támad!');
      } else {
        hitAnim(player);
        setStatus('Blokkoltad az anyós támadását!');
      }
    }

    function resetGame() {
      state.playerHP = 100;
      state.enemyHP = 100;
      state.gameOver = false;
      state.aiLocked = false;
      state.combo = 0;
      setHealth(playerHealthBar, 100);
      setHealth(enemyHealthBar, 100);
      finishMessage.classList.remove('show');
      setStatus('Küzdelem');
    }

    punchBtn.addEventListener('click', () => playerAttack('punch'));
    kickBtn.addEventListener('click', () => playerAttack('kick'));
    specialBtn.addEventListener('click', () => playerAttack('special'));
    restartBtn.addEventListener('click', resetGame);

    document.addEventListener('keydown', (event) => {
      if (state.gameOver) return;
      const key = event.key.toLowerCase();
      if (key === 'a') playerAttack('punch');
      if (key === 's') playerAttack('kick');
      if (key === 'd') playerAttack('special');
    });

    resetGame();
  </script>
</body>
</html>
