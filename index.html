<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anyós: ULTIMATE FATALITY</title>
  <style>
    :root {
      --bg1: #050408;
      --bg2: #0f0b1a;
      --bg3: #2a1230;
      --panel: rgba(18, 12, 32, 0.92);
      --cyan: #8aeaff;
      --cyan2: #29c6ff;
      --red: #ff5c73;
      --red2: #d6213e;
      --gold: #ffd770;
      --gold2: #ff9e3d;
      --violet: #cf8dff;
      --green: #5ff291;
      --text: #f7f8ff;
      --shadow: rgba(0,0,0,0.65);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Courier New", monospace;
      background: linear-gradient(180deg, var(--bg2), var(--bg1));
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
    }

    .game-shell {
      position: relative;
      width: min(1220px, 98vw);
      height: min(800px, 95vh);
      border-radius: 26px;
      overflow: hidden;
      background: rgba(12, 8, 22, 0.98);
      border: 3px solid rgba(138, 234, 255, 0.15);
      box-shadow:
        0 0 0 3px rgba(129, 234, 255, 0.06),
        0 40px 100px rgba(0,0,0,0.7),
        inset 0 0 30px rgba(255,255,255,0.02);
    }

    .game-shell.shake {
      animation: shake 0.16s linear 3;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0) translateY(0); }
      20% { transform: translateX(-8px) translateY(-6px); }
      40% { transform: translateX(8px) translateY(6px); }
      60% { transform: translateX(-6px) translateY(-8px); }
      80% { transform: translateX(6px) translateY(4px); }
    }

    .hud {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 16px;
      z-index: 35;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .fighter-info {
      width: 38%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .fighter-info.right {
      align-items: flex-end;
    }

    .label-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 900;
      color: rgba(255,255,255,0.95);
      text-shadow: 0 4px 14px rgba(0,0,0,0.8);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 16px currentColor, 0 0 28px currentColor;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 16px currentColor, 0 0 28px currentColor; }
      50% { box-shadow: 0 0 8px currentColor, 0 0 14px currentColor; }
    }

    .player .dot { background: var(--cyan); color: var(--cyan); }
    .enemy .dot { background: var(--red); color: var(--red); }

    .health-bar {
      position: relative;
      width: 100%;
      height: 26px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }

    .health-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 100%;
      border-radius: 12px;
      transition: width 0.18s ease;
      box-shadow: 0 0 16px rgba(255,255,255,0.3);
    }

    .health-damage {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 100%;
      background: rgba(255, 0, 0, 0.4);
      border-radius: 12px;
      opacity: 0;
    }

    .health-damage.show {
      animation: damageFlash 0.3s ease-out;
    }

    @keyframes damageFlash {
      0% { opacity: 1; width: var(--dmg-width); }
      100% { opacity: 0; width: 0; }
    }

    .player .health-fill {
      background: linear-gradient(90deg, #8aeaff, #4ecafc 45%, #1d8ff0 100%);
    }

    .enemy .health-fill {
      background: linear-gradient(90deg, #ffb0a8, #ff5867 45%, #cd2148 100%);
    }

    .status-box {
      position: absolute;
      left: 50%;
      top: 75px;
      transform: translateX(-50%);
      z-index: 32;
      min-width: 280px;
      text-align: center;
      background: rgba(10, 8, 18, 0.55);
      border: 2px solid rgba(138, 234, 255, 0.20);
      border-radius: 999px;
      padding: 9px 18px;
      color: rgba(138, 234, 255, 0.95);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 900;
      box-shadow: 0 0 18px rgba(138, 234, 255, 0.08), inset 0 0 16px rgba(138, 234, 255, 0.04);
    }

    .combo-counter {
      position: absolute;
      right: 18px;
      top: 24px;
      z-index: 32;
      font-size: 18px;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 12px var(--gold), 0 4px 12px rgba(0,0,0,0.5);
      letter-spacing: 1px;
    }

    .difficulty-badge {
      position: absolute;
      left: 18px;
      top: 24px;
      z-index: 32;
      background: rgba(255, 110, 80, 0.2);
      border: 1px solid rgba(255, 110, 80, 0.4);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 900;
      color: rgba(255, 110, 80, 0.9);
    }

    .arena {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% 15%, rgba(120, 100, 255, 0.32), transparent 20%),
        linear-gradient(180deg, #0f0d1e 0%, #3a1d45 35%, #1a1225 100%);
      overflow: hidden;
    }

    .arena::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.02) 0,
        rgba(255,255,255,0.02) 1px,
        transparent 1px,
        transparent 24px
      );
      opacity: 0.9;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 8;
    }

    .sun-glow {
      position: absolute;
      left: 50%;
      top: 10%;
      transform: translateX(-50%);
      width: 480px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.25), rgba(120,100,255,0.15), transparent 70%);
      filter: blur(22px);
      z-index: 2;
    }

    .spotlight {
      position: absolute;
      left: 50%;
      top: 32%;
      transform: translateX(-50%);
      width: 680px;
      height: 280px;
      background: radial-gradient(circle at center, rgba(255,255,255,0.08), rgba(255,255,255,0.01), transparent 68%);
      filter: blur(18px);
      z-index: 2;
    }

    .floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 150px;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.0), rgba(0,0,0,0.25)),
        linear-gradient(90deg, #241f2a, #1a151f 38%, #2a2232 100%);
      border-top: 5px solid rgba(138, 234, 255, 0.08);
      box-shadow: inset 0 12px 20px rgba(255,255,255,0.04);
      z-index: 3;
    }

    .floor::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,0.14) 0 2px, transparent 2px 16px);
      opacity: 0.12;
    }

    .floor::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(138, 234, 255, 0.06) 0 1px, transparent 1px 12px);
      opacity: 0.08;
    }

    .fighter {
      --tx: 0px;
      --scale: 1;
      position: absolute;
      bottom: 120px;
      width: 190px;
      height: 280px;
      transform: translateX(var(--tx)) scaleX(var(--scale));
      transition: transform 0.12s ease-out, filter 0.12s ease;
      z-index: 12;
      filter: drop-shadow(0 20px 20px rgba(0,0,0,0.3));
    }

    .fighter.player {
      left: 22%;
    }

    .fighter.enemy {
      left: 74%;
      --scale: -1;
    }

    .fighter .shadow {
      position: absolute;
      left: 50%;
      bottom: -22px;
      width: 120px;
      height: 24px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.38), rgba(0,0,0,0.12), transparent);
      filter: blur(4px);
    }

    .fighter .head {
      position: absolute;
      left: 50%;
      top: 0;
      width: 66px;
      height: 75px;
      transform: translateX(-50%);
      border-radius: 48% 48% 46% 46%;
      background: linear-gradient(180deg, #f8deb5, #da9a68 72%, #9e5c40);
      box-shadow: inset -10px -8px 0 rgba(0,0,0,0.06);
    }

    .fighter .head::before,
    .fighter .head::after {
      content: "";
      position: absolute;
      top: 23px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(0,0,0,0.8);
    }

    .fighter .head::before { left: 17px; }
    .fighter .head::after { right: 17px; }

    .fighter .hair {
      position: absolute;
      left: 50%;
      top: -7px;
      width: 76px;
      height: 28px;
      transform: translateX(-50%);
      border-radius: 50% 50% 25% 25%;
      background: rgba(14, 8, 10, 0.85);
    }

    .fighter .body {
      position: absolute;
      left: 50%;
      top: 60px;
      width: 90px;
      height: 98px;
      transform: translateX(-50%);
      border-radius: 32% 32% 16% 16% / 24% 24% 12% 12%;
      background: linear-gradient(180deg, #ffeccf, #d2a26f 60%, #82573d);
      box-shadow: inset -12px -10px 0 rgba(0,0,0,0.07);
    }

    .fighter .arm {
      position: absolute;
      width: 19px;
      height: 92px;
      top: 84px;
      border-radius: 20px;
      background: linear-gradient(180deg, #f8d4a8, #d28a64);
      transform-origin: center top;
    }

    .fighter .arm.left { left: 23px; transform: rotate(32deg); }
    .fighter .arm.right { right: 23px; transform: rotate(-30deg); }

    .fighter .leg {
      position: absolute;
      bottom: 0;
      width: 23px;
      height: 108px;
      border-radius: 19px;
      background: linear-gradient(180deg, #ede0a6, #b88362);
    }

    .fighter .leg.left { left: 56px; }
    .fighter .leg.right { right: 56px; }

    .fighter.player .head {
      background: linear-gradient(180deg, #f5d8b2, #dd9569 72%, #a35d41);
    }

    .fighter.player .hair { background: rgba(16, 28, 55, 0.86); }

    .fighter.player .body,
    .fighter.player .arm,
    .fighter.player .leg {
      background: linear-gradient(180deg, #d4ecff, #75c1ff 62%, #2d5dca);
    }

    .fighter.enemy .head {
      background: linear-gradient(180deg, #f9d8b3, #d98c63 72%, #954b39);
    }

    .fighter.enemy .hair { background: rgba(44, 14, 28, 0.82); }

    .fighter.enemy .body,
    .fighter.enemy .arm,
    .fighter.enemy .leg {
      background: linear-gradient(180deg, #ffdad7, #eb6e74 60%, #8b2140);
    }

    .fighter.hit {
      animation: hitFlash 0.32s ease-out;
    }

    @keyframes hitFlash {
      0% { filter: brightness(1) saturate(1) hue-rotate(0deg); }
      25% { filter: brightness(1.8) saturate(1.5) hue-rotate(2deg); }
      50% { filter: brightness(1) saturate(1) hue-rotate(0deg); transform: translateX(var(--tx)) scaleX(var(--scale)) translateX(-12px) rotate(-1deg); }
      100% { filter: brightness(1) saturate(1) hue-rotate(0deg); transform: translateX(var(--tx)) scaleX(var(--scale)); }
    }

    .fighter.attack {
      animation: attackBump 0.2s ease-out;
    }

    @keyframes attackBump {
      0% { transform: translateX(var(--tx)) scaleX(var(--scale)) translateY(0) scale(1); }
      40% { transform: translateX(var(--tx)) scaleX(var(--scale)) translateX(16px) translateY(-10px) scale(1.02); }
      100% { transform: translateX(var(--tx)) scaleX(var(--scale)) scale(1); }
    }

    .impact {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      z-index: 18;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .impact.show {
      animation: burst 0.45s ease-out forwards;
    }

    @keyframes burst {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.15); }
      35% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); }
    }

    .impact.punch {
      background: radial-gradient(circle, rgba(255,255,255,0.96) 0%, rgba(255,228,130,0.92) 16%, rgba(255,140,75,0.74) 44%, transparent 75%);
      box-shadow: 0 0 30px rgba(255,140,75,0.5);
    }

    .impact.kick {
      background: radial-gradient(circle, rgba(255,255,255,0.96) 0%, rgba(130,226,255,0.92) 16%, rgba(50,130,255,0.74) 44%, transparent 75%);
      box-shadow: 0 0 30px rgba(50,130,255,0.5);
    }

    .impact.special {
      background: radial-gradient(circle, rgba(255,255,255,0.97) 0%, rgba(255,200,235,0.92) 16%, rgba(200,100,255,0.76) 44%, transparent 75%);
      box-shadow: 0 0 30px rgba(200,100,255,0.6);
    }

    .swoosh {
      position: absolute;
      width: 240px;
      height: 120px;
      border: 5px solid rgba(255,255,255,0.28);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-10deg);
      opacity: 0;
      z-index: 17;
      pointer-events: none;
      box-shadow: inset 0 0 12px rgba(255,255,255,0.12);
    }

    .swoosh.show {
      animation: swoosh 0.3s ease-out forwards;
    }

    @keyframes swoosh {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(-10deg) scale(0.2); }
      35% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(-10deg) scale(1.15); }
    }

    .blood-splat {
      position: absolute;
      pointer-events: none;
      z-index: 16;
      opacity: 0;
    }

    .blood-splat.show {
      animation: splatFall 0.8s ease-out forwards;
    }

    @keyframes splatFall {
      0% { opacity: 0.8; transform: translateY(-40px) scale(0.8); }
      100% { opacity: 0; transform: translateY(20px) scale(1); }
    }

    .finish-message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      background: rgba(5, 4, 8, 0.5);
    }

    .finish-message.show {
      opacity: 1;
      pointer-events: auto;
    }

    .finish-card {
      background: rgba(15, 10, 25, 0.95);
      border: 3px solid rgba(138, 234, 255, 0.2);
      border-radius: 20px;
      padding: 28px 32px;
      text-align: center;
      box-shadow:
        0 0 40px rgba(138, 234, 255, 0.15),
        0 0 80px rgba(0,0,0,0.6),
        inset 0 0 20px rgba(138, 234, 255, 0.05);
      max-width: 540px;
      animation: cardPop 0.4s ease-out;
    }

    @keyframes cardPop {
      0% { transform: scale(0.7) rotateX(-20deg); opacity: 0; }
      100% { transform: scale(1) rotateX(0deg); opacity: 1; }
    }

    .finish-card h2 {
      margin: 0 0 12px 0;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 0 20px var(--gold), 0 4px 16px rgba(0,0,0,0.8);
    }

    .finish-card p {
      margin: 0 0 20px 0;
      color: rgba(255,255,255,0.85);
      font-size: 16px;
      line-height: 1.6;
      letter-spacing: 0.5px;
    }

    .finish-card button {
      min-width: 200px;
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 35;
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      width: min(800px, 92%);
    }

    button {
      appearance: none;
      border: none;
      cursor: pointer;
      outline: none;
      color: #180a0b;
      background: linear-gradient(180deg, #ffe899, #f7ba4c 64%, #d97d2a);
      border-radius: 14px;
      padding: 13px 20px;
      min-width: 145px;
      font-weight: 900;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      box-shadow:
        0 9px 0 rgba(130, 65, 0, 0.85),
        0 16px 24px rgba(0,0,0,0.24);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.2s ease;
      font-family: "Courier New", monospace;
    }

    button:active {
      transform: translateY(5px);
      box-shadow:
        0 4px 0 rgba(130, 65, 0, 0.85),
        0 10px 20px rgba(0,0,0,0.2);
    }

    button.alt {
      background: linear-gradient(180deg, #a1f0ff, #46ceff 64%, #1e82dc);
      box-shadow:
        0 9px 0 rgba(14, 68, 115, 0.84),
        0 16px 24px rgba(0,0,0,0.24);
    }

    button.warn {
      background: linear-gradient(180deg, #ffddee, #ff73ca 64%, #d23fb0);
      box-shadow:
        0 9px 0 rgba(115, 24, 85, 0.84),
        0 16px 24px rgba(0,0,0,0.24);
    }

    button:hover:not(:active) {
      filter: brightness(1.05) drop-shadow(0 0 6px rgba(255,255,255,0.2));
    }

    .difficulty-select {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 35;
      display: flex;
      gap: 8px;
    }

    .diff-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      min-width: unset;
      font-size: 11px;
      border-radius: 8px;
      box-shadow:
        0 6px 0 rgba(80, 40, 0, 0.8),
        0 10px 16px rgba(0,0,0,0.2);
    }

    .diff-btn.active {
      box-shadow:
        0 0 0 3px rgba(138, 234, 255, 0.4),
        0 6px 0 rgba(80, 40, 0, 0.8),
        0 10px 16px rgba(0,0,0,0.2);
    }

    @media (max-width: 760px) {
      .game-shell { width: 98vw; height: 92vh; }
      .fighter-info { width: 44%; }
      .controls { width: 94%; gap: 8px; bottom: 14px; }
      button { min-width: 100px; padding: 11px 14px; font-size: 11px; }
      .diff-btn { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>
  <div class="game-shell" id="gameShell">
    <div class="difficulty-badge" id="difficultyBadge">Normal</div>
    <div class="combo-counter" id="comboCounter" style="display:none;">COMBO x0</div>

    <div class="hud">
      <div class="fighter-info player">
        <div class="label-row">
          <span class="dot"></span>
          <span>Te</span>
        </div>
        <div class="health-bar">
          <div class="health-damage" id="playerDamage"></div>
          <div class="health-fill" id="playerHealth"></div>
        </div>
      </div>

      <div class="fighter-info enemy right">
        <div class="label-row">
          <span>Anyós</span>
          <span class="dot"></span>
        </div>
        <div class="health-bar">
          <div class="health-damage" id="enemyDamage"></div>
          <div class="health-fill" id="enemyHealth"></div>
        </div>
      </div>
    </div>

    <div class="status-box" id="statusBox">Küzdelem kezdődik...</div>

    <div class="arena" id="arena">
      <div class="sun-glow"></div>
      <div class="spotlight"></div>

      <div class="fighter player" id="player">
        <div class="shadow"></div>
        <div class="head"></div>
        <div class="hair"></div>
        <div class="body"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>

      <div class="fighter enemy" id="enemy">
        <div class="shadow"></div>
        <div class="head"></div>
        <div class="hair"></div>
        <div class="body"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>

      <div class="impact punch" id="playerImpact"></div>
      <div class="impact punch" id="enemyImpact"></div>
      <div class="swoosh" id="playerSwoosh"></div>
      <div class="swoosh" id="enemySwoosh"></div>

      <div class="floor"></div>
    </div>

    <div class="controls">
      <button id="punchBtn">Ütés (A)</button>
      <button id="kickBtn" class="alt">Rúgás (S)</button>
      <button id="specialBtn" class="warn">Fatality (D)</button>
    </div>

    <div class="difficulty-select">
      <button class="diff-btn active" data-diff="0">EASY</button>
      <button class="diff-btn" data-diff="1">NORM</button>
      <button class="diff-btn" data-diff="2">HARD</button>
      <button class="diff-btn" data-diff="3">BOSS</button>
    </div>

    <div class="finish-message" id="finishMessage">
      <div class="finish-card">
        <h2 id="finishTitle">Győzelem!</h2>
        <p id="finishText">A családi béke helyreállt.</p>
        <button id="restartBtn">Új mérkőzés</button>
      </div>
    </div>
  </div>

  <script>
    const player = document.getElementById('player');
    const enemy = document.getElementById('enemy');
    const playerHealthBar = document.getElementById('playerHealth');
    const enemyHealthBar = document.getElementById('enemyHealth');
    const playerDamage = document.getElementById('playerDamage');
    const enemyDamage = document.getElementById('enemyDamage');
    const statusBox = document.getElementById('statusBox');
    const comboCounter = document.getElementById('comboCounter');
    const difficultyBadge = document.getElementById('difficultyBadge');
    const playerImpact = document.getElementById('playerImpact');
    const enemyImpact = document.getElementById('enemyImpact');
    const playerSwoosh = document.getElementById('playerSwoosh');
    const enemySwoosh = document.getElementById('enemySwoosh');
    const finishMessage = document.getElementById('finishMessage');
    const finishTitle = document.getElementById('finishTitle');
    const finishText = document.getElementById('finishText');
    const gameShell = document.getElementById('gameShell');
    const arena = document.getElementById('arena');
    const punchBtn = document.getElementById('punchBtn');
    const kickBtn = document.getElementById('kickBtn');
    const specialBtn = document.getElementById('specialBtn');
    const restartBtn = document.getElementById('restartBtn');

    const difficultyLevels = ['EASY', 'NORMAL', 'HARD', 'BOSS'];
    const diffNames = ['EASY', 'NORM', 'HARD', 'BOSS'];

    const state = {
      playerHP: 100,
      enemyHP: 100,
      gameOver: false,
      aiLocked: false,
      combo: 0,
      difficulty: 1,
      round: 1,
      totalDamageDealt: 0,
      totalDamageReceived: 0,
      lastMoveTime: 0
    };

    // Audio synthesis
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(freq, duration, type = 'sine', volume = 0.03, modulate = false) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.type = type;
        osc.frequency.value = freq;
        if (modulate) {
          osc.frequency.exponentialRampToValueAtTime(freq * 0.6, now + duration);
        }

        gain.gain.value = volume;
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.stop(now + duration);
      } catch (e) {}
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function setHealth(el, value) {
      el.style.width = value + '%';
    }

    function setStatus(text) {
      statusBox.textContent = text;
    }

    function updateCombo() {
      if (state.combo > 0) {
        comboCounter.style.display = 'block';
        comboCounter.textContent = `COMBO x${state.combo}`;
      } else {
        comboCounter.style.display = 'none';
      }
    }

    function shakeArena() {
      gameShell.classList.remove('shake');
      void gameShell.offsetWidth;
      gameShell.classList.add('shake');
    }

    function createParticles(x, y, count = 8) {
      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        particle.style.background = i % 2 === 0 ? 'rgba(255,200,100,0.8)' : 'rgba(255,150,50,0.8)';
        particle.style.animation = `particleFloat ${0.6 + Math.random() * 0.4}s ease-out forwards`;
        const angle = (i / count) * Math.PI * 2;
        const vx = Math.cos(angle) * (40 + Math.random() * 60);
        const vy = Math.sin(angle) * (40 + Math.random() * 60) - 40;
        particle.style.setProperty('--vx', vx + 'px');
        particle.style.setProperty('--vy', vy + 'px');
        arena.appendChild(particle);
        setTimeout(() => particle.remove(), 1000);
      }
    }

    const style = document.createElement('style');
    style.textContent = `
      @keyframes particleFloat {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 0; transform: translate(var(--vx), var(--vy)); }
      }
    `;
    document.head.appendChild(style);

    function applyImpact(target, type) {
      target.className = 'impact show ' + type;
      setTimeout(() => {
        target.className = 'impact ' + type;
      }, 450);
    }

    function applySwoosh(target, left, top) {
      target.style.left = left + '%';
      target.style.top = top + '%';
      target.classList.remove('show');
      void target.offsetWidth;
      target.classList.add('show');
      setTimeout(() => target.classList.remove('show'), 300);
    }

    function attackAnim(fighter) {
      fighter.classList.remove('attack');
      void fighter.offsetWidth;
      fighter.classList.add('attack');
      setTimeout(() => fighter.classList.remove('attack'), 200);
    }

    function hitAnim(fighter) {
      fighter.classList.remove('hit');
      void fighter.offsetWidth;
      fighter.classList.add('hit');
      setTimeout(() => fighter.classList.remove('hit'), 320);
    }

    function showDamageFlash(target, damage) {
      const el = target === 'player' ? playerDamage : enemyDamage;
      const healthEl = target === 'player' ? playerHealthBar : enemyHealthBar;
      const maxWidth = healthEl.parentElement.offsetWidth;
      const dmgWidth = (damage / 100) * maxWidth;
      el.style.setProperty('--dmg-width', dmgWidth + 'px');
      el.classList.remove('show');
      void el.offsetWidth;
      el.classList.add('show');
    }

    function finishGame(playerWon, text) {
      state.gameOver = true;
      finishTitle.textContent = playerWon ? '🔥 FATALITY! 🔥' : 'GAME OVER';
      finishText.textContent = text;
      finishMessage.classList.add('show');

      if (playerWon) {
        playSound(480, 0.2, 'sine', 0.05);
        setTimeout(() => playSound(600, 0.2, 'sine', 0.05), 150);
        setTimeout(() => playSound(720, 0.3, 'sine', 0.06), 300);
      } else {
        playSound(180, 0.3, 'sawtooth', 0.04);
      }
    }

    function doDamage(target, amount) {
      if (target === 'player') {
        state.playerHP = clamp(state.playerHP - amount, 0, 100);
        state.totalDamageReceived += amount;
        setHealth(playerHealthBar, state.playerHP);
        showDamageFlash('player', amount);
        hitAnim(player);
        shakeArena();
        createParticles(player.offsetLeft + 90, player.offsetTop + 140, 6);
        playSound(150 + Math.random() * 50, 0.1, 'sine', 0.04, true);
      } else {
        state.enemyHP = clamp(state.enemyHP - amount, 0, 100);
        state.totalDamageDealt += amount;
        setHealth(enemyHealthBar, state.enemyHP);
        showDamageFlash('enemy', amount);
        hitAnim(enemy);
        shakeArena();
        createParticles(enemy.offsetLeft + 90, enemy.offsetTop + 140, 6);
        playSound(220 + Math.random() * 60, 0.1, 'sine', 0.04, true);
      }

      if (state.playerHP <= 0) {
        finishGame(false, `Vereség! Az anyós győzött ${state.totalDamageDealt} sebzés után. Küldd el a rá vonatkozó koszoruút!`);
      }

      if (state.enemyHP <= 0) {
        finishGame(true, `VICTORY! ${state.totalDamageDealt} sebzés! A családi béke most nyertesen helyreállt. 👑`);
      }
    }

    function playerAttack(type) {
      if (state.gameOver || state.aiLocked) return;

      let damage = 8;
      let effectType = 'punch';
      let soundFreq = 220;

      if (type === 'kick') {
        damage = 14;
        effectType = 'kick';
        soundFreq = 280;
      } else if (type === 'special') {
        damage = state.difficulty === 3 ? 16 : 24;
        effectType = 'special';
        soundFreq = 350;
      }

      state.aiLocked = true;
      state.lastMoveTime = Date.now();
      attackAnim(player);
      applySwoosh(playerSwoosh, 48, 50);
      applyImpact(playerImpact, effectType);
      playerImpact.style.left = '62%';
      playerImpact.style.top = '52%';
      playSound(soundFreq, 0.12, 'triangle', 0.05);

      if (type === 'special' && state.enemyHP <= 35) {
        createParticles(enemy.offsetLeft + 90, enemy.offsetTop + 140, 12);
        state.enemyHP = 0;
        setHealth(enemyHealthBar, 0);
        finishGame(true, '💀 FATALITY! Az anyós megsemmisült! A ház végre csendes! 💀');
        return;
      }

      const blockChance = state.difficulty === 0 ? 0.7 : state.difficulty === 1 ? 0.82 : state.difficulty === 2 ? 0.88 : 0.92;
      const blocked = Math.random() > blockChance && type !== 'special';
      const finalDamage = blocked ? Math.ceil(damage * 0.35) : damage;

      if (!blocked) {
        doDamage('enemy', finalDamage);
        state.combo += 1;
        updateCombo();
        setStatus(type === 'special' ? '🔥 FATALITY ELŐKÉSZÜLET! 🔥' : `COMBO! x${state.combo}`);
      } else {
        hitAnim(enemy);
        setStatus('Az anyós blokkolt!');
        state.combo = 0;
        updateCombo();
      }

      if (!state.gameOver) {
        setTimeout(() => {
          state.aiLocked = false;
          if (!state.gameOver) enemyAiTurn();
        }, 480);
      }
    }

    function enemyAiTurn() {
      if (state.gameOver) return;

      let roll = Math.random();
      const diffMult = state.difficulty * 0.08;
      roll += diffMult;

      let type = 'punch';
      let damage = 8 + state.difficulty * 2;
      let soundFreq = 240;

      if (roll > 0.65) {
        type = 'kick';
        damage = 14 + state.difficulty * 2;
        soundFreq = 300;
      }
      if (roll > 0.88) {
        type = 'special';
        damage = 22 + state.difficulty * 3;
        soundFreq = 360;
      }

      attackAnim(enemy);
      applySwoosh(enemySwoosh, 58, 50);
      applyImpact(enemyImpact, type);
      enemyImpact.style.left = '38%';
      enemyImpact.style.top = '52%';
      playSound(soundFreq, 0.12, 'triangle', 0.05);

      const playerBlockChance = 0.82 + state.difficulty * 0.02;
      const blocked = Math.random() > playerBlockChance;
      const finalDamage = blocked ? Math.ceil(damage * 0.38) : damage;

      if (!blocked) {
        doDamage('player', finalDamage);
        setStatus(type === 'special' ? '⚡ Az anyós különlegeset dobott! ⚡' : `Az anyós támad! [${damage} sebzés]`);
      } else {
        hitAnim(player);
        setStatus('✓ Sikeresen blokkoltál!');
      }
    }

    function resetGame() {
      state.playerHP = 100;
      state.enemyHP = 100;
      state.gameOver = false;
      state.aiLocked = false;
      state.combo = 0;
      state.round = 1;
      state.totalDamageDealt = 0;
      state.totalDamageReceived = 0;
      setHealth(playerHealthBar, 100);
      setHealth(enemyHealthBar, 100);
      finishMessage.classList.remove('show');
      setStatus('Küzdelem kezdődik...');
      updateCombo();
    }

    // Difficulty buttons
    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.difficulty = parseInt(e.target.dataset.diff);
        difficultyBadge.textContent = diffNames[state.difficulty];
        resetGame();
      });
    });

    punchBtn.addEventListener('click', () => playerAttack('punch'));
    kickBtn.addEventListener('click', () => playerAttack('kick'));
    specialBtn.addEventListener('click', () => playerAttack('special'));
    restartBtn.addEventListener('click', resetGame);

    document.addEventListener('keydown', (event) => {
      if (state.gameOver) return;
      const key = event.key.toLowerCase();
      if (key === 'a') playerAttack('punch');
      if (key === 's') playerAttack('kick');
      if (key === 'd') playerAttack('special');
    });

    // Initialize
    resetGame();
  </script>
</body>
</html>
