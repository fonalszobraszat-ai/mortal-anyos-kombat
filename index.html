<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anyós vs. Te</title>
  <style>
    :root {
      --bg1: #120d1d;
      --bg2: #1a112a;
      --panel: rgba(18, 12, 27, 0.85);
      --red: #ff4c5f;
      --red2: #ff2c40;
      --orange: #ffb347;
      --gold: #ffd86b;
      --cyan: #78ebff;
      --green: #7ef9a4;
      --white: #f5f7fb;
      --shadow: rgba(0,0,0,0.52);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(circle at 50% 15%, rgba(98, 97, 172, 0.35), transparent 28%),
        linear-gradient(180deg, var(--bg2), var(--bg1));
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--white);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .game-shell {
      width: min(1100px, 94vw);
      height: min(700px, 84vh);
      background: rgba(18, 12, 27, 0.9);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      box-shadow:
        0 0 0 2px rgba(120, 235, 255, 0.1),
        0 30px 80px rgba(0,0,0,0.55);
      overflow: hidden;
      position: relative;
    }

    .hud {
      position: absolute;
      top: 16px;
      left: 18px;
      right: 18px;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      pointer-events: none;
    }

    .fighter-info {
      width: 42%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .fighter-info.right {
      align-items: flex-end;
    }

    .label-row {
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
      font-size: 13px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
    }

    .label-row .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 14px currentColor;
    }

    .player .dot { color: var(--cyan); background: var(--cyan); }
    .enemy .dot { color: var(--red); background: var(--red); }

    .health-bar {
      position: relative;
      height: 22px;
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.12);
      overflow: hidden;
      box-shadow: inset 0 0 16px rgba(0,0,0,0.5);
    }

    .health-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 100%;
      background: linear-gradient(90deg, #63f3ad, #3fe6a0 65%, #bfef63 100%);
      border-radius: 12px;
      transition: width 0.25s ease, filter 0.25s ease;
    }

    .enemy .health-fill {
      background: linear-gradient(90deg, #ff7b6e, #ff4f53 60%, #d52335 100%);
    }

    .arena {
      position: relative;
      height: 100%;
      width: 100%;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.12)),
        radial-gradient(circle at 50% 20%, rgba(39, 67, 130, 0.32), transparent 25%),
        linear-gradient(180deg, #1b1b35 0%, #4a2147 30%, #2e1b2d 100%);
      overflow: hidden;
    }

    .arena::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.02) 0 2px,
          transparent 2px 39px
        );
      opacity: 0.7;
    }

    .floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 117px;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.0), rgba(0,0,0,0.24)),
        linear-gradient(90deg, #31232f, #1e1d2c 40%, #2b273b 100%);
      border-top: 4px solid rgba(255,255,255,0.09);
      box-shadow: inset 0 8px 18px rgba(255,255,255,0.06);
    }

    .floor::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.08) 0 2px,
          transparent 2px 28px
        );
      opacity: 0.15;
    }

    .fighter {
      --x: 0px;
      --scale: 1;
      position: absolute;
      left: 50%;
      bottom: 106px;
      width: 160px;
      height: 240px;
      transform: translateX(var(--x)) scaleX(var(--scale));
      transition: transform 0.12s ease-out, filter 0.12s ease;
      z-index: 10;
    }

    .fighter.player {
      left: 25%;
    }

    .fighter.enemy {
      left: 72%;
      --scale: -1;
    }

    .fighter .shadow {
      position: absolute;
      left: 50%;
      bottom: -24px;
      width: 112px;
      height: 22px;
      background: rgba(0,0,0,0.38);
      transform: translateX(-50%);
      border-radius: 50%;
      filter: blur(2px);
    }

    .fighter .body {
      position: absolute;
      inset: 24px 36px 0 36px;
      background: linear-gradient(180deg, #ffe8c9, #d1986a 60%, #8d5d3b);
      border-radius: 42% 42% 18% 18% / 30% 30% 16% 16%;
      box-shadow: inset -10px -8px 0 rgba(0,0,0,0.08);
    }

    .fighter .head {
      position: absolute;
      width: 62px;
      height: 68px;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      border-radius: 44% 44% 48% 48%;
      background: linear-gradient(180deg, #f5d0a4, #d99664 70%, #ba775a);
      box-shadow: inset -8px -8px 0 rgba(0,0,0,0.06);
    }

    .fighter .head::before,
    .fighter .head::after {
      content: "";
      position: absolute;
      top: 20px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(0,0,0,0.72);
    }

    .fighter .head::before { left: 17px; }
    .fighter .head::after { right: 17px; }

    .fighter .hair {
      position: absolute;
      left: 50%;
      top: -4px;
      transform: translateX(-50%);
      width: 68px;
      height: 22px;
      border-radius: 50% 50% 20% 20%;
      background: rgba(35, 18, 18, 0.8);
    }

    .fighter .arm {
      position: absolute;
      width: 18px;
      height: 82px;
      top: 76px;
      background: linear-gradient(180deg, #f7cf9a, #cc8966);
      border-radius: 20px;
      transform-origin: center top;
    }

    .fighter .arm.left { left: 12px; transform: rotate(30deg); }
    .fighter .arm.right { right: 12px; transform: rotate(-30deg); }

    .fighter .leg {
      position: absolute;
      width: 22px;
      height: 96px;
      background: linear-gradient(180deg, #e0bf8d, #af6e4d);
      bottom: 0;
      border-radius: 18px;
    }

    .fighter .leg.left { left: 48px; }
    .fighter .leg.right { right: 48px; }

    .fighter.player .body { background: linear-gradient(180deg, #c1ebff, #5db0ff 60%, #2d5fc5); }
    .fighter.player .head { background: linear-gradient(180deg, #f5d7a8, #d79d6a 70%, #9b5f42); }
    .fighter.player .hair { background: rgba(18,42,74,0.82); }
    .fighter.player .arm, .fighter.player .leg { background: linear-gradient(180deg, #d5ecff, #6bb5ff); }

    .fighter.enemy .body { background: linear-gradient(180deg, #ffd2d1, #e46a6a 60%, #912d3c); }
    .fighter.enemy .head { background: linear-gradient(180deg, #f7d8af, #d38862 70%, #924c3d); }
    .fighter.enemy .hair { background: rgba(47, 12, 28, 0.78); }
    .fighter.enemy .arm, .fighter.enemy .leg { background: linear-gradient(180deg, #ffd8cc, #d2786d); }

    .fighter.hit {
      animation: hit-flash 0.3s ease-out;
    }

    @keyframes hit-flash {
      0% { filter: brightness(1); transform: translateX(var(--x)) scaleX(var(--scale)) translateY(0); }
      25% { filter: brightness(1.7) saturate(1.4); transform: translateX(var(--x)) scaleX(var(--scale)) translateX(-10px) translateY(-4px); }
      50% { filter: brightness(1); transform: translateX(var(--x)) scaleX(var(--scale)) translateX(8px); }
      100% { filter: brightness(1); transform: translateX(var(--x)) scaleX(var(--scale)); }
    }

    .fighter.attack {
      animation: attack-bump 0.18s ease-out;
    }

    @keyframes attack-bump {
      0% { transform: translateX(var(--x)) scaleX(var(--scale)) translateY(0); }
      35% { transform: translateX(var(--x)) scaleX(var(--scale)) translateX(14px) translateY(-8px); }
      100% { transform: translateX(var(--x)) scaleX(var(--scale)); }
    }

    .effect {
      position: absolute;
      width: 110px;
      height: 110px;
      pointer-events: none;
      z-index: 12;
      opacity: 0;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.85));
    }

    .effect.show {
      animation: pop 0.38s ease-out forwards;
    }

    @keyframes pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.25); }
    }

    .effect.punch {
      background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,191,77,0.9) 20%, rgba(255,111,61,0.8) 45%, transparent 70%);
      border-radius: 50%;
    }

    .effect.kick {
      background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(124,203,255,0.9) 18%, rgba(43,129,255,0.75) 42%, transparent 72%);
      border-radius: 50%;
    }

    .effect.special {
      background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,110,175,0.85) 18%, rgba(164,72,255,0.72) 45%, transparent 72%);
      border-radius: 50%;
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      width: min(650px, 90%);
    }

    button {
      appearance: none;
      border: none;
      background: linear-gradient(180deg, #f9d36d, #ec8d2d 60%, #ce5f1a);
      color: #180d0d;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow:
        0 8px 0 rgba(110, 47, 0, 0.85),
        0 12px 20px rgba(0,0,0,0.25);
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      min-width: 130px;
      text-transform: uppercase;
    }

    button:active {
      transform: translateY(4px);
      box-shadow:
        0 4px 0 rgba(110, 47, 0, 0.85),
        0 8px 18px rgba(0,0,0,0.25);
    }

    button.alt {
      background: linear-gradient(180deg, #8bf3ff, #3dc5ff 60%, #1d80d8);
      box-shadow:
        0 8px 0 rgba(13, 70, 117, 0.82),
        0 12px 20px rgba(0,0,0,0.25);
    }

    button.warn {
      background: linear-gradient(180deg, #ffb4d8, #ff5eb3 60%, #cb2d8f);
      box-shadow:
        0 8px 0 rgba(116, 18, 83, 0.8),
        0 12px 20px rgba(0,0,0,0.25);
    }

    .message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      background: rgba(9, 7, 18, 0.42);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .message.show {
      opacity: 1;
      pointer-events: auto;
    }

    .message-card {
      background: rgba(22, 15, 34, 0.9);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 26px 28px;
      box-shadow: 0 0 32px rgba(0,0,0,0.5);
    }

    .message-card h2 {
      margin: 0 0 10px 0;
      font-size: clamp(24px, 3vw, 42px);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .message-card p {
      margin: 0 0 18px 0;
      font-size: 16px;
      color: rgba(255,255,255,0.76);
    }

    .message-card button {
      min-width: 180px;
    }

    @media (max-width: 760px) {
      .game-shell { width: 96vw; height: 86vh; }
      .fighter-info { width: 46%; }
      .controls { gap: 8px; }
      button { min-width: 100px; padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="hud">
      <div class="fighter-info player">
        <div class="label-row">
          <span class="dot"></span>
          <span>Te</span>
        </div>
        <div class="health-bar">
          <div class="health-fill" id="playerHealth"></div>
        </div>
      </div>

      <div class="fighter-info enemy right">
        <div class="label-row">
          <span>Anyós</span>
          <span class="dot"></span>
        </div>
        <div class="health-bar">
          <div class="health-fill" id="enemyHealth"></div>
        </div>
      </div>
    </div>

    <div class="arena" id="arena">
      <div class="fighter player" id="player">
        <div class="shadow"></div>
        <div class="head"></div>
        <div class="hair"></div>
        <div class="body"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>

      <div class="fighter enemy" id="enemy">
        <div class="shadow"></div>
        <div class="head"></div>
        <div class="hair"></div>
        <div class="body"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>

      <div class="effect punch" id="playerEffect"></div>
      <div class="effect punch" id="enemyEffect"></div>

      <div class="floor"></div>
    </div>

    <div class="controls">
      <button id="punchBtn">Ütés</button>
      <button id="kickBtn" class="alt">Rúgás</button>
      <button id="specialBtn" class="warn">Különleges</button>
    </div>

    <div class="message" id="message">
      <div class="message-card">
        <h2 id="messageTitle">Győzelem!</h2>
        <p id="messageText">Az anyós megadta magát.</p>
        <button id="restartBtn">Új kör</button>
      </div>
    </div>
  </div>

  <script>
    const player = document.getElementById('player');
    const enemy = document.getElementById('enemy');
    const playerHealthBar = document.getElementById('playerHealth');
    const enemyHealthBar = document.getElementById('enemyHealth');
    const messageBox = document.getElementById('message');
    const messageTitle = document.getElementById('messageTitle');
    const messageText = document.getElementById('messageText');
    const playerEffect = document.getElementById('playerEffect');
    const enemyEffect = document.getElementById('enemyEffect');

    const punchBtn = document.getElementById('punchBtn');
    const kickBtn = document.getElementById('kickBtn');
    const specialBtn = document.getElementById('specialBtn');
    const restartBtn = document.getElementById('restartBtn');

    const state = {
      playerHP: 100,
      enemyHP: 100,
      gameOver: false,
      aiTimer: null
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function setBarHealth(element, value) {
      element.style.width = value + '%';
    }

    function triggerAttackAnimation(fighter) {
      fighter.classList.remove('attack');
      void fighter.offsetWidth;
      fighter.classList.add('attack');
      setTimeout(() => fighter.classList.remove('attack'), 180);
    }

    function triggerHitAnimation(fighter) {
      fighter.classList.remove('hit');
      void fighter.offsetWidth;
      fighter.classList.add('hit');
      setTimeout(() => fighter.classList.remove('hit'), 300);
    }

    function applyDamage(target, amount) {
      if (target === 'player') {
        state.playerHP = clamp(state.playerHP - amount, 0, 100);
        setBarHealth(playerHealthBar, state.playerHP);
        triggerHitAnimation(player);

        if (state.playerHP <= 0) {
          finishGame(false, 'Az anyós túlságosan erős volt…');
        }
      } else {
        state.enemyHP = clamp(state.enemyHP - amount, 0, 100);
        setBarHealth(enemyHealthBar, state.enemyHP);
        triggerHitAnimation(enemy);

        if (state.enemyHP <= 0) {
          finishGame(true, 'Gratulálok! Az anyós megadta magát.');
        }
      }
    }

    function playerAttack(kind) {
      if (state.gameOver) return;

      let damage = 8;
      let effectClass = 'punch';

      if (kind === 'kick') {
        damage = 14;
        effectClass = 'kick';
      } else if (kind === 'special') {
        damage = 26;
        effectClass = 'special';
      }

      triggerAttackAnimation(player);
      playerEffect.className = 'effect show ' + effectClass;
      setTimeout(() => playerEffect.className = 'effect ' + effectClass, 350);

      applyDamage('enemy', damage);

      if (!state.gameOver) {
        window.setTimeout(enemyAiTurn, 500);
      }
    }

    function enemyAiTurn() {
      if (state.gameOver) return;

      const moveRoll = Math.random();
      let damage = 8;
      let effectClass = 'punch';

      if (moveRoll > 0.66) {
        damage = 15;
        effectClass = 'kick';
      }
      if (moveRoll > 0.9) {
        damage = 24;
        effectClass = 'special';
      }

      triggerAttackAnimation(enemy);
      enemyEffect.className = 'effect show ' + effectClass;
      setTimeout(() => enemyEffect.className = 'effect ' + effectClass, 350);

      applyDamage('player', damage);
    }

    function finishGame(playerWon, text) {
      state.gameOver = true;
      messageTitle.textContent = playerWon ? 'Győzelem!' : 'Vereség!';
      messageText.textContent = text;
      messageBox.classList.add('show');
    }

    function resetGame() {
      state.playerHP = 100;
      state.enemyHP = 100;
      state.gameOver = false;
      setBarHealth(playerHealthBar, 100);
      setBarHealth(enemyHealthBar, 100);
      messageBox.classList.remove('show');
    }

    punchBtn.addEventListener('click', () => playerAttack('punch'));
    kickBtn.addEventListener('click', () => playerAttack('kick'));
    specialBtn.addEventListener('click', () => playerAttack('special'));
    restartBtn.addEventListener('click', resetGame);

    document.addEventListener('keydown', (event) => {
      if (state.gameOver) return;
      const key = event.key.toLowerCase();
      if (key === 'a') playerAttack('punch');
      if (key === 's') playerAttack('kick');
      if (key === 'd') playerAttack('special');
    });

    resetGame();
  </script>
</body>
</html>
